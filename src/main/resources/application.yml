spring:
  boot:
    admin:
      notify:
        mail:
          enabled: ${MAIL_ENABLED:false}
          from: Spring Boot Admin <noreply@localhost>
          to:
            - root@localhost
      hazelcast:
        enabled: ${HAZELCAST_ENABLED:false}

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"
      cors:
        allowed-headers: "*"
        allowed-methods: "*"
        allowed-origins: "*"
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

server:
  port: ${SERVER_PORT:8080}

---

spring:
  config:
    activate:
      on-profile: in-memory

bremersee:
  authentication:
    in-memory:
      enabled: true
      users:
        - name: ${ADMIN_NAME:admin}
          password: ${ADMIN_PASSWORD:changeit}
          authorities:
            - ROLE_ADMIN
            - ROLE_ACTUATOR_ADMIN
        - name: ${ACTUATOR_USER_NAME:actuator}
          password: ${ACTUATOR_USER_PASSWORD:changeit}
          authorities:
            - ROLE_ACTUATOR

---

spring:
  config:
    activate:
      on-profile: test

  security:
    user:
      name: admin
      password: changeit
      roles:
        - "ADMIN"
        - "ACTUATOR_ADMIN"
